name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node Dependencies & Build Assets
        run: |
          npm ci
          npm run production

      - name: Deploy via RSYNC
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='deploy.tar.gz' \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no -p 22" \
            ./ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/var/www/html/B2B/

      - name: Run Post-Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /var/www/html/B2B
            
            # Set proper permissions
            sudo chmod -R 777 storage bootstrap/cache
            
            # Install Composer dependencies (without dev dependencies)
            composer install --no-dev --optimize-autoloader
            
            # Run database migrations
            php artisan migrate --force
            
            # Clear all caches
            php artisan optimize:clear
            
            # Cache configuration
            php artisan config:cache
            
            # Cache routes
            php artisan route:cache
            
            # Cache views
            php artisan view:cache
            
            echo "✅ Deployment completed successfully!"